# IEEE 123-Bus Sparse Sensor Observability & Out-of-Distribution Shift Configuration

feeder:
  name: "ieee123"
  master_path: "feeders/ieee123/IEEE123Master.dss"
  num_nodes: 123
  nominal_voltage_kv: 4.16

simulation:
  seed: 101
  num_normal: 50
  load_multipliers: [0.60, 0.75, 1.00, 1.25, 1.40]
  fault_resistances: [0.01, 1.00, 5.00, 20.00, 50.00]
  der_penetrations_kw: [0.0, 500.0, 1000.0]
  measurement_noise_std: 0.02
  sensor_coverage: "sparse" # 20% monitoring

features:
  use_physics_features: true
  include_sequence_components: true
  include_differentials: true
  raw_feature_dim: 9
  total_node_feature_dim: 20

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  protocol: "held_out_locations"

model:
  name: "physics_guided_gnn"
  backbone: "gcn"
  hidden_dim: 128
  num_layers: 3
  dropout: 0.20

training:
  epochs: 30
  batch_size: 32
  lr: 0.001
  patience: 8

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distribution-fault-research"
version = "0.1.0"
description = "Physics-Guided, Topology-Aware Fault Detection and Localization in Unbalanced Distribution Networks under Sensor Sparsity and Distribution Shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Distribution Grid Research Team" }
]
keywords = [
    "power-systems",
    "distribution-networks",
    "fault-diagnosis",
    "graph-neural-networks",
    "physics-informed-ml",
    "opendss",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "opendssdirect.py>=0.8.0",
    "torch>=2.0.0",
    "torch_geometric>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "simulation: marks tests that execute OpenDSS power-flow simulations (slow)",
    "smoke: lightweight fast integration smoke tests",
    "unit: standalone fast unit tests",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"
line_length = 100
